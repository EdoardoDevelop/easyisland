name: Build

# Builds the Windows app on every push / PR to main and on development branches
# (the installer is kept as a run artifact) and publishes it on tags like `v0.1.0`.

on:
  push:
    branches: [main, 'claude/**']
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Tags like `v0.2.0` publish a GitHub release: the installer, its updater
# signature and latest.json, which the installed apps read to update themselves
# (src-tauri/src/updates.rs). The installer is not Authenticode-signed yet, so
# SmartScreen warns on the first manual download (and Defender once flagged it
# as Trojan:Win32/Wacatac.H!ml, a false positive). Set PUBLISH to 'false' to
# build tags without publishing.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the content of the
# private key made with `npx tauri signer generate`; its public half is in
# tauri.conf.json). Without it a tag still builds, but publishing stops.
env:
  PUBLISH: 'true'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # `npm run build` (run by tauri as beforeBuildCommand) builds easyisland-hook
      # first, which tauri.conf.json then bundles as a resource. `pack` then
      # copies the installer out of target/ under its shipping name.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTES: EasyIsland ${{ github.ref_name }}
        run: |
          # Release tags with the signing key also make the updater artifacts.
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and $env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --config src-tauri/tauri.updater.json
          } else {
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/pack.mjs
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      # Always kept as a private artifact of the run (visible only to people
      # with access to the repository), so a build can be installed without
      # publishing a release. PUBLISH below still gates the public release.
      - uses: actions/upload-artifact@v4
        with:
          name: EasyIsland-Windows-setup
          path: release/EasyIsland-Windows-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 30

      - name: Publish the release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          if (-not (Test-Path "release/latest.json")) {
            throw "release/latest.json is missing: add the TAURI_SIGNING_PRIVATE_KEY secret, or the installed apps cannot update."
          }
          $notes = @"
          EasyIsland per Windows $v — Slime in cima al tuo schermo.

          **Prima installazione:** scarica ``EasyIsland-Windows-$v-setup.exe`` ed eseguilo.
          L'installer non è ancora firmato, quindi Windows SmartScreen mostra un avviso:
          clicca **Ulteriori informazioni → Esegui comunque**.

          **Già installato:** l'app trova da sola questa versione e la propone
          nell'isola (Impostazioni → Generale → Aggiornamenti).
          "@
          gh release create "${{ github.ref_name }}" `
            "release/EasyIsland-Windows-$v-setup.exe" `
            "release/EasyIsland-Windows-$v-setup.exe.sig" `
            "release/latest.json" `
            --title "EasyIsland per Windows $v" `
            --notes $notes `
            --latest

      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The tag has to follow the release, or windows-latest keeps pointing
            # at the first commit it was ever created from and anyone building
            # from it gets an old tree.
            git tag -f windows-latest "${{ github.sha }}"
            git push -f origin windows-latest
            gh release edit windows-latest --title "EasyIsland per Windows (ultima)" --notes "Sempre la build Windows più recente: attualmente $v."
            gh release upload windows-latest "release/EasyIsland-Windows-setup.exe" --clobber
          } else {
            gh release create windows-latest `
              "release/EasyIsland-Windows-setup.exe" `
              --title "EasyIsland per Windows (ultima)" `
              --notes "Sempre la build Windows più recente: attualmente $v." `
              --latest=false
          }
