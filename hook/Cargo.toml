[package]
name = "easyisland-hook"
description = "Relays Claude Code hook events to EasyIsland over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "easyisland-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Just enough Win32 to know our own SID, to check who is serving the pipe and
# to type "Continua" into a session's console.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
