[workspace]
members = ["src-tauri", "hook"]
resolver = "2"

[workspace.package]
version = "1.0.54"
edition = "2021"
license = "MIT"

# Release profile shared by the app and the hook relay: the hook must start fast
# (Claude Code spawns it on every event), so we optimise for size and speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Quick tests on this PC (`npm run prova`, docs/sviluppo.md): as release
# (panic = "abort" included) but without the whole-program LTO, which cannot be
# split or reused and took over ten minutes; incremental, so a second build only
# redoes what changed. Never for the installer.
[profile.prova]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
