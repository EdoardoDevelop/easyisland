[package]
name = "easyisland"
description = "EasyIsland for Windows — Slime lives at the top of your screen"
authors = ["EdoardoDevelop", "Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "easyisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Updates from GitHub releases, signed with our own key and verified before install.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Time",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Already in the tree through Tauri (same versions): used to read the real path
# of a file dropped on the island, see drop.rs.
webview2-com = "0.39"
windows-core-wv2 = { package = "windows-core", version = "0.62" }
# Already in the tree through Tauri (tray-icon, muda; same version): screenshots
# and pictures copied to the clipboard are saved and shown as PNG, see clipimage.rs.
png = "0.18"
