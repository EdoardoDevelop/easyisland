<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>EasyIsland — prova dei suoni</title>
    <style>
      body { margin: 0; padding: 20px; background: #16171b; color: #e6e7ea; font: 14px system-ui, "Segoe UI", sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: #9a9ea8; margin: 0 0 16px; }
      .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8b90a0; margin: 22px 0 8px; }
      table { border-collapse: collapse; width: 100%; max-width: 760px; }
      td { padding: 6px 8px; border-bottom: 1px solid #25272e; }
      td.name { font-family: ui-monospace, Consolas, monospace; color: #b9c0ff; width: 90px; }
      td.label { color: #c9ccd3; }
      button { background: #2a2d36; color: #eef; border: 1px solid #3a3e4a; border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; }
      button.new { background: #2f6b2a; border-color: #3f8a38; }
      button:hover { filter: brightness(1.2); }
      tr.playing td { background: #1f2a1f; }
    </style>
  </head>
  <body>
    <h1>Prova dei suoni</h1>
    <p>I suoni dell'app, generati nel codice (<code>src/core/synth.ts</code>). Il volume parte da quello dell'app.</p>
    <div class="bar">
      <label>Volume <input id="vol" type="range" min="0" max="0.4" step="0.01" value="0.12" /></label>
      <span id="volv">0.12</span>
      <button class="new" id="all">▶ Riproduci tutti</button>
      <button id="stop">■ Ferma</button>
    </div>
    <div id="list"></div>
    <script type="module" src="./sounds-preview.ts"></script>
  </body>
</html>
