<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyIsland</title>
    <style>
      body { margin: 0; background: transparent; overflow: hidden; }
      #bot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      /*
       * At rest and beside the open island the character is alive for ever by
       * CSS: a still picture moved by the compositor, so its page draws nothing
       * (src/character-window/main.ts). Three motions of different lengths add
       * up (float, sway, breath) so it never repeats the same way, with a halo
       * of its colour pulsing behind it. Only transform and opacity: no repaint.
       * Compact, the island moves it and this is off.
       */
      #float, #sway, #breathe { position: absolute; inset: 0; }
      #halo {
        position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1;
        transform: translate(-50%, -50%); border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, var(--halo, rgba(127, 211, 255, 0.9)) 0%, transparent 70%);
      }
      body.alive #float { animation: float 3.4s ease-in-out infinite; }
      body.alive #sway { animation: sway 5.3s ease-in-out infinite; }
      body.alive #breathe { animation: breathe 2.6s ease-in-out infinite; }
      body.alive #halo { animation: halo 3.4s ease-in-out infinite; }
      body.alive #float, body.alive #sway, body.alive #breathe, body.alive #halo { will-change: transform, opacity; }
      /* Every motion starts from the still pose: starting tilted or shifted
         made the resting character jump as it appeared (Edoardo, 29 Oct 2026). */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(-3.5px); }
        75% { transform: translateY(1.5px); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(5deg); }
        75% { transform: rotate(-5deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        40% { transform: scale(1.07, 0.95); }
        70% { transform: scale(0.97, 1.04); }
      }
      @keyframes halo {
        0%, 100% { opacity: 0.15; transform: translate(-50%, -50%) scale(0.85); }
        50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.25); }
      }
      /* The fixed bar's areas and elements (src/island/bar.ts prepares them).
         --s grows and shrinks them with the bar's height, --ts is the text's own
         size, --gap the room between elements, --bar-bg the background with its
         opacity (main.ts → layBar, «Aspetto della barra»). */
      /* The band is a path (main.ts → bandPath) so it can swell around the
         character under the mouse: the window grows past the band meanwhile
         (bar_grow), and everything stays --t tall against the screen edge. */
      #band { position: absolute; left: 0; top: 0; width: 100%; display: none; overflow: visible; pointer-events: none; }
      #band path { fill: var(--bar-bg, transparent); transition: d 0.36s cubic-bezier(0.22, 1, 0.36, 1); pointer-events: none; }
      #bandFx, #bandSheen { fill: none; }
      body.bar #band { display: block; }
      body.bar.bottom #band { top: auto; bottom: 0; transform: scaleY(-1); }
      .area { position: absolute; top: 0; height: var(--t, 100%); display: none; align-items: center; gap: var(--gap, 4px); box-sizing: border-box; }
      body.bar.bottom .area { top: auto; bottom: 0; }
      body.bar .area { display: flex; }
      /* «Isolette»: each area its own island, the desktop in between. */
      body.islands .area { top: calc(var(--t) * 0.12); height: calc(var(--t) * 0.76); border-radius: 999px; padding: 0 calc(4px * var(--s, 1)); }
      body.islands.bottom .area { top: auto; bottom: calc(var(--t) * 0.12); }
      /* Under the mouse the character's own island grows with it. */
      body.islands .area.own { transition: height 0.36s cubic-bezier(0.22, 1, 0.36, 1); }
      body.islands.grown .area.own { height: calc(var(--t) * 0.76 + var(--g, 0px)); }
      /* The character grows from the edge, a little past its size before settling. */
      #grow { position: absolute; inset: 0; transform-origin: 50% 0; transition: transform 0.4s cubic-bezier(0.34, 1.36, 0.5, 1); }
      body.bottom #grow { transform-origin: 50% 100%; }
      body.grown #grow { transform: scale(var(--k, 1)); transition-duration: 0.46s; }
      body.islands .area:not(:empty), body.islands .area.own { background: var(--bar-bg, transparent); }
      body.islands .area:empty:not(.own) { display: none; }
      /* «Ombra»: each island's own, under it (above it with the bar at the bottom). */
      body.islands.shadow .area:not(:empty), body.islands.shadow .area.own { box-shadow: 0 2px 5px rgba(0, 0, 0, 0.28); }
      body.islands.shadow.bottom .area:not(:empty), body.islands.shadow.bottom .area.own { box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.28); }
      .bar-btn {
        all: unset; display: flex; align-items: center; min-width: 0; max-width: calc(240px * var(--s, 1));
        padding: calc(3px * var(--s, 1)) calc(8px * var(--s, 1)); border-radius: calc(8px * var(--s, 1)); cursor: pointer; white-space: nowrap;
        font: calc(12px * var(--s, 1) * var(--ts, 1)) "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink, #f5f6f8);
      }
      /* A small graph of the last minute (CPU, memory, GPU, network). */
      .bar-graph { width: calc(34px * var(--s, 1)); height: calc(14px * var(--s, 1)); flex: none; margin-left: 2px; overflow: visible; }
      .bar-graph polyline { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; opacity: 0.85; }
      .bar-item .bar-strip-btn { padding: 1px 6px; margin-left: 2px; }
      .bar-btn:hover { background: color-mix(in srgb, var(--ink, #fff) 12%, transparent); }
      .bar-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .bar-icon { display: grid; place-items: center; flex: none; }
      .bar-icon svg, .bar-icon img { width: calc(15px * var(--s, 1)); height: calc(15px * var(--s, 1)); }
      .bar-icon img.bar-app-icon { width: calc(17px * var(--s, 1)); height: calc(17px * var(--s, 1)); }
      .bar-text { overflow: hidden; text-overflow: ellipsis; }
      /* Aspetto → Font in the bar (character-window/main.ts layBar). */
      body.own-font .bar-btn { font-family: var(--bar-font); }
      body.own-weight .bar-btn, body.own-weight .bar-strip-text strong { font-weight: var(--bar-weight); }
      /* A changing value with the room of its widest (bar.ts → widest): both in one cell. */
      .bar-steady { display: inline-grid; }
      .bar-steady > span { grid-area: 1 / 1; white-space: nowrap; }
      .bar-ghost { visibility: hidden; }
      /* System elements: muted volume or microphone, low battery. */
      .bar-item.dim { opacity: 0.55; }
      .bar-sys .bar-text { font-variant-numeric: tabular-nums; }
      .bar-btn.warn .bar-text { color: #F5A524; }
      .bar-btn.error .bar-text { color: #F4505E; }
      /* Transparent bar: over the wallpaper the text needs a shadow to be read. */
      body.see-through .bar-btn { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75), 0 0 6px rgba(0, 0, 0, 0.45); }
      .bar-more { font-size: calc(16px * var(--s, 1)); letter-spacing: 1px; padding: 0 10px; }
      /* «Personalizza la barra» (character-window/main.ts setEditing): outlines, ×, «Fine», where a drop lands. */
      body.editing .area .bar-btn:not(.bar-done):not(.bar-more) { position: relative; outline: 1px dashed color-mix(in srgb, var(--ink, #fff) 45%, transparent); outline-offset: -2px; cursor: grab; }
      body.editing .bar-btn.carried { opacity: 0.35; cursor: grabbing; }
      .bar-x { position: absolute; top: 1px; right: 1px; width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 system-ui, sans-serif; color: #fff; background: #F4505E; cursor: pointer; }
      /* «App» (character-window/apps.ts): one icon per app, a mark under the open ones. */
      .bar-btn:has(.bar-apps) { padding: 0 calc(2px * var(--s, 1)); max-width: none; }
      .bar-btn:has(.bar-apps):hover { background: none; }
      .bar-apps { display: flex; align-items: center; gap: calc(2px * var(--s, 1)); }
      .app-ico { position: relative; width: calc(32px * var(--s, 1)); height: calc(32px * var(--s, 1)); display: grid; place-items: center; border-radius: calc(7px * var(--s, 1)); cursor: pointer; }
      .app-ico:hover { background: color-mix(in srgb, var(--ink, #fff) 12%, transparent); }
      .app-ico.active { background: color-mix(in srgb, var(--ink, #fff) 16%, transparent); }
      .app-ico img { width: calc(22px * var(--s, 1)); height: calc(22px * var(--s, 1)); pointer-events: none; }
      .app-letter { width: calc(22px * var(--s, 1)); height: calc(22px * var(--s, 1)); display: grid; place-items: center; border-radius: 6px; font-weight: 600; background: color-mix(in srgb, var(--ink, #fff) 18%, transparent); }
      .app-ico.open::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 6px; height: 3px; margin-left: -3px; border-radius: 2px; background: color-mix(in srgb, var(--ink, #fff) 60%, transparent); }
      .app-ico.open.many::after { box-shadow: 5px 0 0 color-mix(in srgb, var(--ink, #fff) 35%, transparent); }
      .app-ico.active::after { width: 14px; margin-left: -7px; background: #38bdf8; }
      .app-ico.attention { background: color-mix(in srgb, #F5A524 30%, transparent); }
      .app-ico.attention::after { background: #F5A524; }
      .app-ico.drop-on { outline: 2px solid #22C55E; outline-offset: -2px; background: color-mix(in srgb, #22C55E 22%, transparent); }
      /* An element with nothing to show now (bar.ts emptyPiece): only while customizing. */
      .bar-btn:has(.bar-empty) { display: none; }
      body.editing .bar-btn:has(.bar-empty) { display: flex; opacity: 0.6; font-style: italic; }
      .bar-done { color: #fff; background: #3B82F6; border-radius: 6px; padding: 0 10px; font-weight: 600; cursor: pointer; }
      .bar-done:hover { background: #2563EB; }
      #bar-drop { position: absolute; top: 12%; height: 76%; width: 3px; border-radius: 2px; background: #3B82F6; box-shadow: 0 0 6px #3B82F6; display: none; pointer-events: none; z-index: 9; }
      #bar-drop.on { display: block; }
      #bar-drop-label { position: absolute; top: 50%; transform: translateY(-50%); padding: 1px 8px; border-radius: 999px; font: 500 11px system-ui, sans-serif; color: #fff; background: #3B82F6; display: none; pointer-events: none; z-index: 9; white-space: nowrap; }
      #bar-drop-label.on { display: block; }
      .bar-btn.drop-into { outline: 2px solid #22C55E !important; outline-offset: -2px; background: color-mix(in srgb, #22C55E 22%, transparent) !important; }
      body.editing .area .bar-btn.optioned { outline: 2px solid #3B82F6; outline-offset: -2px; background: color-mix(in srgb, #3B82F6 22%, transparent); }
      .bar-action { border-left: 2px solid var(--action, transparent); padding-left: 6px; }
      /* The strip in the bar (src/island/bar.ts stripPiece), coloured by what it holds. */
      .bar-btn:has(.bar-strip) { max-width: calc(560px * var(--s, 1)); }
      .bar-strip { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .bar-strip-text { display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow: hidden; }
      .bar-strip-text strong { font-weight: 600; white-space: nowrap; }
      .bar-strip-sub { opacity: 0.7; overflow: hidden; text-overflow: ellipsis; }
      .bar-strip[data-tone="approval"] strong { color: #F5A524; }
      .bar-strip[data-tone="call"] strong { color: #22C55E; }
      .bar-strip[data-tone="live"] strong { color: #F4505E; }
      .bar-strip[data-tone="work"] strong { color: #4EA8FF; }
      .bar-strip-btn {
        display: flex; align-items: center; gap: 4px; flex: none; padding: 2px 9px; border-radius: 999px;
        background: color-mix(in srgb, var(--ink, #fff) 14%, transparent);
        border-left: 2px solid var(--action, transparent);
      }
      .bar-strip-btn:hover { background: color-mix(in srgb, var(--ink, #fff) 24%, transparent); }
      .bar-strip-btn.light { background: var(--ink, #fff); color: #111; }
      .bar-strip-btn.green { background: #22C55E; color: #fff; }
      .bar-strip-btn.red { background: #F4505E; color: #fff; }
      /* Fixed bar design variants (src/settings/main.ts → barLookRows → design). */
      body.bar-pills:not(.islands):not(.see-through) #bandBase,
      body.bar-compact:not(.islands):not(.see-through) #bandBase {
        stroke: color-mix(in srgb, var(--ink, #fff) 13%, transparent);
        stroke-width: 1px;
      }
      body.bar-pills .bar-btn:has(.bar-wide),
      body.bar-compact .bar-btn:has(.bar-wide) { max-width: calc(390px * var(--s, 1)); }
      .bar-klabel {
        font-size: calc(9.5px * var(--s, 1) * var(--ts, 1)); font-weight: 600;
        letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.56; line-height: 1;
      }
      .bar-meter {
        width: calc(34px * var(--s, 1)); height: calc(6px * var(--s, 1)); border-radius: 999px;
        background: color-mix(in srgb, var(--ink, #fff) 7%, transparent);
        border: 1px solid color-mix(in srgb, var(--ink, #fff) 22%, transparent);
        overflow: hidden; flex: none; margin-left: 3px; box-sizing: border-box;
      }
      .bar-meter-fill { display: block; width: 0%; height: 100%; border-radius: 0; background: #38BDF8; transition: width 0.25s ease, background 0.2s ease; }
      .bar-meter-fill.high { background: #F5A524; }
      .bar-meter-fill.crit { background: #F4505E; }
      .bar-eq { display: inline-flex; align-items: flex-end; gap: 1.5px; height: calc(10px * var(--s, 1)); flex: none; }
      .bar-eq span { width: calc(2px * var(--s, 1)); border-radius: 1px; background: #22C55E; height: 40%; animation: bar-eq 0.9s ease-in-out infinite; }
      .bar-eq span:nth-child(2) { animation-delay: 0.2s; height: 95%; }
      .bar-eq span:nth-child(3) { animation-delay: 0.4s; height: 65%; }
      @keyframes bar-eq {
        0%, 100% { transform: scaleY(0.45); }
        50% { transform: scaleY(1); }
      }
      /* Windows «Riduci animazioni»: the bars stand still while music plays. */
      @media (prefers-reduced-motion: reduce) { .bar-eq span { animation: none; } }
      /* Proposal A: pills & telemetry. */
      body.bar-pills .bar-btn {
        background: color-mix(in srgb, var(--ink, #fff) 6%, transparent);
        border: 1px solid color-mix(in srgb, var(--ink, #fff) 10%, transparent);
        border-radius: calc(9px * var(--s, 1));
        padding: calc(3px * var(--s, 1)) calc(9px * var(--s, 1));
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      body.bar-pills .bar-btn:hover {
        background: color-mix(in srgb, var(--ink, #fff) 13%, transparent);
        border-color: color-mix(in srgb, var(--ink, #fff) 20%, transparent);
      }
      body.bar-pills .bar-btn:has(.bar-item.dim) {
        background: color-mix(in srgb, var(--ink, #fff) 3%, transparent);
        border-color: color-mix(in srgb, var(--ink, #fff) 6%, transparent);
      }
      body.bar-pills .bar-btn:has(.bar-strip) {
        background: color-mix(in srgb, #4EA8FF 12%, transparent);
        border-color: color-mix(in srgb, #4EA8FF 26%, transparent);
      }
      body.bar-pills .bar-btn:has(.bar-strip[data-tone="approval"]) {
        background: color-mix(in srgb, #F5A524 12%, transparent);
        border-color: color-mix(in srgb, #F5A524 28%, transparent);
      }
      body.bar-pills .bar-btn:has(.bar-strip[data-tone="call"]) {
        background: color-mix(in srgb, #22C55E 12%, transparent);
        border-color: color-mix(in srgb, #22C55E 28%, transparent);
      }
      body.bar-pills .bar-btn:has(.bar-strip[data-tone="live"]) {
        background: color-mix(in srgb, #F4505E 12%, transparent);
        border-color: color-mix(in srgb, #F4505E 28%, transparent);
      }
      body.bar-pills.islands .bar-btn {
        background: color-mix(in srgb, var(--ink, #fff) 5%, transparent);
        border-color: color-mix(in srgb, var(--ink, #fff) 8%, transparent);
      }
      body.bar-pills .bar-action { border-left: 2.5px solid var(--action, transparent); padding-left: 6px; }
      /* Proposal C: compact minimal with raised center capsule. */
      body.bar-compact .bar-btn {
        padding: calc(2.5px * var(--s, 1)) calc(7px * var(--s, 1));
        border-radius: calc(8px * var(--s, 1));
        border: 1px solid transparent;
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      body.bar-compact .bar-btn:hover {
        background: color-mix(in srgb, var(--ink, #fff) 10%, transparent);
        border-color: color-mix(in srgb, var(--ink, #fff) 12%, transparent);
      }
      body.bar-compact .bar-item { gap: 5px; }
      body.bar-compact .bar-idle-compact .bar-text { display: none; }
      body.bar-compact #a-center .bar-btn[data-key^="sys:title"],
      body.bar-compact #a-center .bar-btn[data-key="sys:appbar"],
      body.bar-compact #a-center .bar-btn:has(.bar-strip) {
        background: color-mix(in srgb, var(--ink, #fff) 7%, transparent);
        border-color: color-mix(in srgb, var(--ink, #fff) 13%, transparent);
        border-radius: 999px;
        padding: calc(3px * var(--s, 1)) calc(12px * var(--s, 1));
      }
      body.bar-compact #a-center .bar-btn[data-key^="sys:title"]:hover,
      body.bar-compact #a-center .bar-btn[data-key="sys:appbar"]:hover,
      body.bar-compact #a-center .bar-btn:has(.bar-strip):hover {
        background: color-mix(in srgb, var(--ink, #fff) 13%, transparent);
        border-color: color-mix(in srgb, var(--ink, #fff) 22%, transparent);
      }
    </style>
  </head>
  <body>
    <svg id="band">
      <defs>
        <linearGradient id="bandBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%"></linearGradient>
        <radialGradient id="bandFxGrad" cx="50%" cy="50%" r="36%"></radialGradient>
        <linearGradient id="bandAuroraGrad" x1="0%" y1="0%" x2="100%" y2="100%"></linearGradient>
        <linearGradient id="bandSheenGrad" x1="0%" y1="0%" x2="0%" y2="100%"></linearGradient>
      </defs>
      <path id="bandBase" />
      <path id="bandFx" />
      <path id="bandSheen" />
    </svg>
    <div id="a-start" class="area"></div>
    <div id="a-center" class="area"></div>
    <div id="a-end" class="area"></div>
    <div id="float">
      <div id="grow">
        <div id="halo"></div>
        <div id="sway"><div id="breathe"><canvas id="bot"></canvas></div></div>
      </div>
    </div>
    <script type="module" src="/src/character-window/main.ts"></script>
  </body>
</html>
