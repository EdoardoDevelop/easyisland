<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyIsland</title>
    <style>
      body { margin: 0; background: transparent; overflow: hidden; }
      #bot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      /*
       * At rest and beside the open island the character floats and breathes
       * for ever, by CSS: a still picture moved by the compositor, so its page
       * draws nothing (src/character-window/main.ts). Only transform: no
       * repaint. Compact, the island moves it and this is off.
       */
      #float { position: absolute; inset: 0; }
      body.alive #float { animation: float 3.6s ease-in-out infinite; will-change: transform; }
      @keyframes float {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        50% { transform: translateY(-1.5px) scale(1.035, 0.975); }
      }
    </style>
  </head>
  <body>
    <div id="float"><canvas id="bot"></canvas></div>
    <script type="module" src="/src/character-window/main.ts"></script>
  </body>
</html>
